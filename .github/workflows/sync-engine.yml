name: Sync OTL Engine Updates

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check for new stable release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(gh api repos/otl-core/engine-next/releases/latest --jq '.tag_name' 2>/dev/null || echo "")
          if [ -z "$LATEST" ]; then
            echo "No stable release found on engine-next."
            echo "has_update=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "Latest stable release: $LATEST"
          echo "latest=$LATEST" >> $GITHUB_OUTPUT

          # Check if a sync PR or branch already exists for this version
          EXISTING_PR=$(gh pr list --repo "${{ github.repository }}" --head "sync/$LATEST" --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING_PR" ]; then
            echo "PR #${EXISTING_PR} already exists for ${LATEST} - skipping."
            echo "has_update=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "has_update=true" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4
        if: steps.check.outputs.has_update == 'true'
        with:
          fetch-depth: 0

      - name: Check if already up to date
        if: steps.check.outputs.has_update == 'true'
        id: version
        run: |
          CURRENT=$(node -e "console.log(require('./package.json').version)" 2>/dev/null || echo "0.0.0")
          LATEST="${{ steps.check.outputs.latest }}"
          LATEST_VERSION="${LATEST#v}"
          echo "Current version: $CURRENT"
          echo "Latest version: $LATEST_VERSION"
          if [ "$CURRENT" = "$LATEST_VERSION" ]; then
            echo "Already up to date at v$CURRENT."
            echo "needs_sync=false" >> $GITHUB_OUTPUT
          else
            echo "Update available: v${CURRENT} -> ${LATEST}"
            echo "needs_sync=true" >> $GITHUB_OUTPUT
          fi

      - name: Sync upstream changes
        if: steps.check.outputs.has_update == 'true' && steps.version.outputs.needs_sync == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.check.outputs.latest }}
        run: |
          git config user.name "OTL Engine Bot"
          git config user.email "engine-bot@otl-core.dev"

          BRANCH="sync/$LATEST"

          git remote add upstream https://github.com/otl-core/engine-next.git
          git fetch upstream --tags

          git checkout -b "$BRANCH"

          if git merge "$LATEST" --no-edit --allow-unrelated-histories; then
            echo "Merged $LATEST cleanly."
          else
            echo "Merge conflicts detected - committing with conflict markers for manual resolution."
            git add -A
            git commit --no-edit -m "chore: sync engine $LATEST (conflicts need manual resolution)" || true
          fi

          git push origin "$BRANCH"

          RELEASE_URL="https://github.com/otl-core/engine-next/releases/tag/${LATEST}"

          gh pr create \
            --title "chore: sync OTL Engine to ${LATEST}" \
            --body "New stable OTL Engine version available. See [release notes](${RELEASE_URL}). Review changes, resolve any conflicts, and merge to update." \
            --head "${BRANCH}" \
            --base main
